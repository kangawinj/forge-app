<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Glance">
<meta name="theme-color" content="#0b0d12">
<meta name="color-scheme" content="dark">
<title>Glance for iPad</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Shared camera stage; moved into whichever screen needs it -->
<div id="camWrap" class="cam-wrap" hidden>
  <video id="cam" playsinline muted autoplay></video>
  <svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
    <circle class="ring-bg" cx="50" cy="50" r="47"/>
    <circle id="ringFg" class="ring-fg" cx="50" cy="50" r="47" pathLength="100"/>
  </svg>
</div>

<main id="app">

  <!-- Onboarding -->
  <section id="screen-onboard" class="screen" hidden>
    <div class="card">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 64 64"><use href="icons/icon.svg#mark"/></svg>
      </div>
      <h1 data-i18n="welcome">Welcome to Glance</h1>
      <p class="muted" data-i18n="welcomeBody"></p>

      <div id="ob-pin">
        <h2 data-i18n="createPin">Create a 6-digit passcode</h2>
        <p class="muted small" data-i18n="pinWhy"></p>
        <div class="dots" id="ob-dots"></div>
        <div class="keypad" id="ob-keypad"></div>
        <p class="msg" id="ob-msg" role="status"></p>
      </div>

      <div id="ob-face" hidden>
        <h2 data-i18n="enrollTitle">Set up Face Unlock</h2>
        <div id="ob-stage" class="stage"></div>
        <p class="prompt" id="ob-prompt" role="status"></p>
        <div class="row">
          <button class="btn ghost" id="ob-skip" data-i18n="skipFace">Skip, passcode only</button>
          <button class="btn primary" id="ob-start" data-i18n="startEnroll">Start</button>
        </div>
      </div>
    </div>
  </section>

  <!-- Lock screen -->
  <section id="screen-lock" class="screen lock" hidden>
    <div class="card">
      <div class="clock" id="clock" aria-hidden="true"></div>
      <div id="lock-stage" class="stage"></div>
      <p class="prompt" id="lock-prompt" role="status"></p>
      <div class="row center">
        <button class="btn ghost" id="lock-retry" hidden data-i18n="scanAgain">Scan again</button>
        <button class="btn ghost" id="lock-usepin" data-i18n="usePin">Use passcode</button>
      </div>
      <div id="lock-pin" hidden>
        <div class="dots" id="lk-dots"></div>
        <div class="keypad" id="lk-keypad"></div>
        <p class="msg" id="lk-msg" role="status"></p>
      </div>
    </div>
  </section>

  <!-- Vault -->
  <section id="screen-vault" class="screen vault" hidden>
    <header class="bar">
      <h1 data-i18n="vaultTitle">Private Notes</h1>
      <div class="bar-actions">
        <button class="btn small" id="v-new" data-i18n="newNote">New</button>
        <button class="btn small ghost" id="v-settings" data-i18n="settings">Settings</button>
        <button class="btn small primary" id="v-lock" data-i18n="lockNow">Lock</button>
      </div>
    </header>
    <div class="split">
      <ul id="v-list" class="list" aria-label="Notes"></ul>
      <div class="editor">
        <input id="v-title" type="text" autocomplete="off" data-i18n-ph="titlePh" placeholder="Title">
        <textarea id="v-body" data-i18n-ph="bodyPh" placeholder="Write something private…"></textarea>
        <div class="row">
          <span class="muted small" id="v-status"></span>
          <button class="btn small danger" id="v-del" data-i18n="delete">Delete</button>
        </div>
      </div>
    </div>
  </section>

  <!-- Settings -->
  <dialog id="dlg-settings">
    <form method="dialog" class="dlg">
      <h2 data-i18n="settings">Settings</h2>

      <label class="field switch">
        <span data-i18n="faceUnlock">Face unlock</span>
        <input type="checkbox" id="s-face">
      </label>

      <label class="field">
        <span data-i18n="liveness">Liveness check</span>
        <select id="s-live">
          <option value="0" data-i18n="liveOff">Off</option>
          <option value="1" data-i18n="liveLight">Light (1 head turn)</option>
          <option value="2" data-i18n="liveHeavy">Heavy (2 head turns)</option>
        </select>
      </label>

      <label class="field">
        <span data-i18n="strictness">Match strictness</span>
        <select id="s-thr">
          <option value="0.45" data-i18n="strict">Strict</option>
          <option value="0.50" data-i18n="normal">Normal</option>
          <option value="0.55" data-i18n="relaxed">Relaxed</option>
        </select>
      </label>

      <label class="field">
        <span data-i18n="autoLock">Auto-lock after</span>
        <select id="s-idle">
          <option value="1">1 min</option>
          <option value="5">5 min</option>
          <option value="15">15 min</option>
          <option value="0" data-i18n="onLeave">Only when leaving the app</option>
        </select>
      </label>

      <label class="field">
        <span data-i18n="language">Language</span>
        <select id="s-lang">
          <option value="en">English</option>
          <option value="th">ไทย</option>
        </select>
      </label>

      <div class="row wrap">
        <button type="button" class="btn" id="s-reenroll" data-i18n="reenroll">Re-enroll face</button>
        <button type="button" class="btn" id="s-addlook" data-i18n="addLook">Add another look</button>
        <button type="button" class="btn" id="s-changepin" data-i18n="changePin">Change passcode</button>
        <button type="button" class="btn danger" id="s-wipe" data-i18n="wipe">Erase everything</button>
      </div>

      <p class="muted small" data-i18n="honesty"></p>
      <div class="row"><button class="btn primary" value="close" data-i18n="done">Done</button></div>
    </form>
  </dialog>

  <!-- Enrollment / PIN dialog used from settings -->
  <dialog id="dlg-flow">
    <div class="dlg">
      <h2 id="flow-title"></h2>
      <div id="flow-stage" class="stage"></div>
      <div id="flow-pin" hidden>
        <div class="dots" id="fl-dots"></div>
        <div class="keypad" id="fl-keypad"></div>
      </div>
      <p class="prompt" id="flow-prompt" role="status"></p>
      <div class="row"><button class="btn ghost" id="flow-cancel" data-i18n="cancel">Cancel</button></div>
    </div>
  </dialog>

</main>

<script src="vendor/face-api.js"></script>
<script src="app.js"></script>
</body>
</html>
