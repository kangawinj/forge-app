# Manual dispatch only. This repo's code is currently behind the live
# production app (see PR discussion), so deploying it would roll back
# production features. Re-enable the `push` trigger only once this repo
# is confirmed in sync with what's actually running on forge-food-dev.
name: Deploy to Firebase

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Cloud Functions dependencies
        working-directory: functions
        run: npm ci

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy to Firebase
        run: npx firebase-tools@latest deploy --only hosting,functions,firestore:rules --project forge-food-dev --non-interactive
